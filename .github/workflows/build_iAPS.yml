name: 4. Build iAPS
run-name: Build iAPS (${{ github.ref_name }})
on:
  workflow_dispatch:

env:  
  TARGET_BRANCH: ${{ github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode.app 2>/dev/null | head -n 1)
          echo "Xcode : $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Detach Watch App and Live Activity from Project
        run: |
          # Supprime les références aux cibles Watch et Extensions dans le projet Xcode
          sed -i '' '/FreeAPSWatch/d' FreeAPS.xcodeproj/project.pbxproj
          sed -i '' '/LiveActivityExtension/d' FreeAPS.xcodeproj/project.pbxproj

      - name: Build FreeAPS
        run: |
          xcodebuild build \
            -project FreeAPS.xcodeproj \
            -scheme FreeAPS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create IPA Package
        run: |
          mkdir -p artifacts/Payload
          APP_PATH=$(find build_output/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erreur : aucun .app généré"
            exit 1
          fi
          echo "Application trouvée : $APP_PATH"
          cp -R "$APP_PATH" artifacts/Payload/
          cd artifacts
          zip -qry iAPS.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iAPS-IPA
          path: artifacts/iAPS.ipa
          retention-days: 7
