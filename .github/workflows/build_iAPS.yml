name: 4. Build iAPS
run-name: Build iAPS (${{ github.ref_name }})
on:
  workflow_dispatch:

env:  
  TARGET_BRANCH: ${{ github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ env.TARGET_BRANCH }}

      - name: Select Xcode version
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_15*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select --switch "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build Archive
        run: |
          mkdir -p build_output
          xcodebuild archive \
            -project FreeAPS.xcodeproj \
            -scheme FreeAPS \
            -destination "generic/platform=iOS" \
            -archivePath build_output/FreeAPS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p artifacts Payload
          cp -R build_output/FreeAPS.xcarchive/Products/Applications/FreeAPS.app Payload/
          zip -r artifacts/iAPS.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iAPS-IPA
          path: artifacts/iAPS.ipa
