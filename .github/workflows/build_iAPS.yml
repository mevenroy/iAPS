name: 4. Build iAPS
run-name: Build iAPS (${{ github.ref_name }})
on:
  workflow_dispatch:

env:  
  TARGET_BRANCH: ${{ github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: macos-14
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ env.TARGET_BRANCH }}

      - name: Select Xcode 15/16 with iOS SDK
        run: |
          echo "Xcode versions disponibles :"
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_15.4.app /Applications/Xcode_16*.app /Applications/Xcode*.app 2>/dev/null | head -n 1)
          echo "Selection de $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build App
        run: |
          xcodebuild build \
            -project FreeAPS.xcodeproj \
            -scheme FreeAPS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        run: |
          mkdir -p artifacts/Payload
          APP_PATH=$(find build_output/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Dossier .app trouvé : $APP_PATH"
          cp -R "$APP_PATH" artifacts/Payload/
          cd artifacts
          zip -qry iAPS.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iAPS-IPA
          path: artifacts/iAPS.ipa
