name: 4. Build iAPS
run-name: Build iAPS (${{ github.ref_name }})
on:
  workflow_dispatch:

env:
  TARGET_BRANCH: ${{ github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ env.TARGET_BRANCH }}

      - name: Show Xcode & SDK Info
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Strip Watch and Widget Extensions
        run: |
          python3 -c '
          with open("FreeAPS.xcodeproj/project.pbxproj", "r") as f:
              lines = f.readlines()
          
          # Filtrer les références aux cibles secondaires qui posent problème sans signature
          filtered = [
              line for line in lines 
              if "FreeAPSWatch" not in line and "LiveActivityExtension" not in line
          ]
          
          with open("FreeAPS.xcodeproj/project.pbxproj", "w") as f:
              f.writelines(filtered)
          '

      - name: Compile iPhone App
        run: |
          xcodebuild build \
            -project FreeAPS.xcodeproj \
            -scheme FreeAPS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p artifacts/Payload
          APP_PATH=$(find build_output/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erreur : binaire .app non généré"
            exit 1
          fi
          echo "Application trouvée : $APP_PATH"
          cp -R "$APP_PATH" artifacts/Payload/
          cd artifacts
          zip -qry iAPS.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iAPS-IPA
          path: artifacts/iAPS.ipa
          retention-days: 7
